name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Weekly on Monday 09:00 UTC — catches advisories published after the last dependency change
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Export locked dependencies
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-locked.txt

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --no-deps --strict -r requirements-locked.txt
